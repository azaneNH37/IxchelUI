<!-- One page of a <guide-book>; its paragraphs are <div class="text"> (display: block: an inline
     formatting context). -->
<component name="guide-page" params="heading=''">
  <link href="page.css"/>
  <div class="page">
    <if test="heading != ''"><span class="heading" bind:text="heading"></span></if>
    <slot></slot>
  </div>
</component>
