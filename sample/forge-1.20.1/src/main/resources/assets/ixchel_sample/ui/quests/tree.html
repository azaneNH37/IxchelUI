<link rel="stylesheet" href="@ixchel/dark.css"/>
<link rel="stylesheet" href="tree.css"/>
<div class="screen">
  <div class="panel">
    <div class="header">
      <span class="title" t="ixchel_sample.quests.title"></span>
      <span class="hint" t="ixchel_sample.quests.hint"></span>
    </div>
    <div class="body">
      <div class="chapters">
        <for each="chapters" as="c" key="c.id"><button class="chapter" bind:class:selected="c.id == chapter"
                on:click="chapter = c.id; selected = ''">
          <mc-item class="icon" bind:item="c.icon"></mc-item>
          <span bind:text="c.title"></span>
        </button></for>
      </div>
      <div class="stage">
        <div class="view" draggable="true" on:drag="drag($event)" on:wheel="wheel($event)">
          <div class="world" bind:style:transform="'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')'">
            <for each="edges" as="e" key="e.id"><div class="edge" bind:class:done="e.done"
                 bind:style:left="e.x" bind:style:top="e.y" bind:style:width="e.length"
                 bind:style:transform="'rotate(' + e.angle + 'deg)'"></div></for>
            <for each="nodes" as="n" key="n.id"><div class="node" bind:class:locked="n.state == 'locked'"
                 bind:class:ready="n.state == 'ready'" bind:class:done="n.state == 'done'"
                 bind:class:selected="n.id == selected" bind:style:left="n.x" bind:style:top="n.y"
                 on:click="open(n)">
              <mc-item class="icon" bind:item="n.icon"><ix-tooltip class="quest-tip">
                <span class="tip-title" bind:text="n.title"></span>
                <div class="tip-task">
                  <mc-item class="tip-icon" bind:item="n.icon"></mc-item>
                  <span bind:text="n.task"></span>
                </div>
                <span class="tip-state" bind:class:ready="n.state == 'ready'" bind:text="n.label"></span>
              </ix-tooltip></mc-item>
            </div></for>
          </div>
        </div>
        <if test="selected != ''"><div class="detail">
          <div class="detail-head">
            <mc-item class="icon" bind:item="detail.icon"></mc-item>
            <span class="name" bind:text="detail.title"></span>
          </div>
          <span class="line" bind:text="detail.task"></span>
          <span class="line" bind:text="detail.reward"></span>
          <span class="state" bind:text="detail.state"></span>
          <div class="actions">
            <button class="claim" bind:disabled="!detail.ready" on:click="claim" t="ixchel_sample.quests.claim"></button>
            <button class="close" on:click="selected = ''" t="ixchel_sample.quests.close"></button>
          </div>
        </div></if>
      </div>
    </div>
  </div>
</div>
