<link href="panel.css"/>
<link href="@ixchel/mc/player-inventory.html"/>
<link href="@ixchel/mc/tooltip-lines.html"/>
<link href="@ixchel/components/tabs.html"/>
<link href="@ixchel/components/tab.html"/>
<page>
  <div class="ix-panel">
    <ix-tabs class="tabs" bind:value="tab">
      <for each="tabs" as="t" key="t.id"><ix-tab bind:value="t.id" bind:label="t.label" on:pick="select(t)"></ix-tab></for>
    </ix-tabs>
    <div class="page equipment" bind:class:shown="tab == 'equipment'">
      <div class="column">
        <for each="armor" as="s" key="s"><mc-slot class="slot" bind:menuslot="s"></mc-slot></for>
      </div>
      <mc-entity class="doll" bind:entity="doll" t:title="ixchel_sample.character.doll"></mc-entity>
      <div class="column offhand">
        <mc-slot class="slot" bind:menuslot="offhand"></mc-slot>
      </div>
      <div class="crafting">
        <div class="craft-grid">
          <for each="crafting" as="s" key="s"><mc-slot class="slot" bind:menuslot="s"></mc-slot></for>
        </div>
        <span class="arrow">↓</span>
        <mc-slot class="slot result" bind:menuslot="craftResult"></mc-slot>
      </div>
    </div>
    <div class="page list" bind:class:shown="tab == 'attributes'">
      <for each="attributes" as="a" key="a.name"><div class="row attribute">
        <ix-tooltip class="attribute-tip">
          <span class="tip-name" bind:text="a.name"></span>
          <span bind:text="a.description"></span>
        </ix-tooltip>
        <span class="name" bind:text="a.name"></span>
        <span class="value" bind:text="a.value"></span>
      </div></for>
    </div>
    <div class="page list" bind:class:shown="tab == 'effects'">
      <for each="effects" as="e" key="e.id"><div class="row effect" bind:class:ending="e.ending" bind:class:dim="e.dim">
        <img class="effect-icon" bind:src="e.icon"/>
        <span class="name" bind:text="e.name"></span>
        <span class="value" bind:text="e.time"></span>
      </div></for>
      <empty><span class="empty" t="ixchel_sample.character.no_effects"></span></empty>
    </div>
    <div class="page list" bind:class:shown="tab == 'stats'">
      <for each="stats" as="s" key="s.name"><div class="row stat">
        <span class="name" bind:text="s.name"></span>
        <span class="value" bind:text="s.value"></span>
      </div></for>
    </div>
    <mc-player-inventory bind:menu="menu"></mc-player-inventory>
  </div>
</page>
