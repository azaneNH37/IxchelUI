<link href="page.css"/>
<page>
  <div class="screen">
    <div class="ix-panel">
      <div class="header">
        <span class="ix-title" t="ixchel_sample.index.effects.title"></span>
        <div class="tabs">
          <button class="tab opacity-tab" bind:class:ix-selected="tab == 'opacity'" on:click="tab = 'opacity'" t="ixchel_sample.effects.opacity"></button>
          <button class="tab filters-tab" bind:class:ix-selected="tab == 'filters'" on:click="tab = 'filters'" t="ixchel_sample.effects.filters"></button>
          <button class="tab blend-tab" bind:class:ix-selected="tab == 'blend'" on:click="tab = 'blend'" t="ixchel_sample.effects.blend"></button>
          <button class="tab shaders-tab" bind:class:ix-selected="tab == 'shaders'" on:click="tab = 'shaders'" t="ixchel_sample.effects.shaders"></button>
          <button class="tab shapes-tab" bind:class:ix-selected="tab == 'shapes'" on:click="tab = 'shapes'" t="ixchel_sample.effects.shapes"></button>
        </div>
      </div>

      <div class="page" bind:class:shown="tab == 'opacity'">
        <span class="hint" t="ixchel_sample.effects.hint"></span>
        <div class="pair">
          <div class="sample">
            <div class="stack whole"><div class="square a"></div><div class="square b"></div></div>
            <span class="caption" t="ixchel_sample.effects.whole"></span>
          </div>
          <div class="sample">
            <div class="stack apart"><div class="square a"></div><div class="square b"></div></div>
            <span class="caption" t="ixchel_sample.effects.apart"></span>
          </div>
        </div>
        <div class="pair">
          <div class="sample">
            <div class="items whole">
              <mc-item class="item" bind:item="sword"></mc-item>
              <mc-item class="item" bind:item="apple"></mc-item>
              <mc-item class="item" bind:item="grass"></mc-item>
            </div>
            <span class="caption" t="ixchel_sample.effects.items_faded"></span>
          </div>
          <div class="sample">
            <div class="items">
              <mc-item class="item" bind:item="sword"></mc-item>
              <mc-item class="item" bind:item="apple"></mc-item>
              <mc-item class="item" bind:item="grass"></mc-item>
            </div>
            <span class="caption" t="ixchel_sample.effects.items_opaque"></span>
          </div>
        </div>
        <span class="section" t="ixchel_sample.effects.fade"></span>
        <div class="row">
          <div class="card" bind:class:faded="faded">
            <mc-item class="item" bind:item="apple"></mc-item>
            <span t="ixchel_sample.effects.card"></span>
          </div>
          <button class="toggle" on:click="faded = !faded" t="ixchel_sample.effects.toggle"></button>
        </div>
      </div>

      <div class="page tiles" bind:class:shown="tab == 'filters'">
        <for each="filters" as="f" key="f">
          <div class="tile">
            <div class="art" bind:style:filter="f">
              <div class="bar red"></div><div class="bar green"></div><div class="bar blue"></div>
              <mc-item class="item" bind:item="apple"></mc-item>
            </div>
            <span class="caption" bind:text="f"></span>
          </div>
        </for>
      </div>

      <div class="page" bind:class:shown="tab == 'blend'">
        <span class="section" t="ixchel_sample.effects.blend_modes"></span>
        <div class="canvas blends">
          <for each="blends" as="b" key="b">
            <div class="blend-sample">
              <div class="blob" bind:style:mix-blend-mode="b"></div>
              <span class="caption" bind:text="b"></span>
            </div>
          </for>
        </div>
        <span class="section" t="ixchel_sample.effects.backdrop"></span>
        <div class="canvas stripes">
          <for each="stripes" as="i" key="i">
            <div class="stripe" bind:class:dark="i % 2 == 1"></div>
          </for>
          <div class="glass blurred"><span t="ixchel_sample.effects.glass_blur"></span></div>
          <div class="glass gray"><span t="ixchel_sample.effects.glass_gray"></span></div>
        </div>
      </div>

      <div class="page" bind:class:shown="tab == 'shaders'">
        <span class="section" t="ixchel_sample.effects.box_effects"></span>
        <div class="row">
          <button class="glint" t="ixchel_sample.effects.glint"></button>
          <div class="spotlight"><span t="ixchel_sample.effects.spotlight"></span></div>
        </div>
        <span class="section" t="ixchel_sample.effects.layer_effects"></span>
        <div class="ground">
          <div class="row">
            <div class="card burn" bind:class:burnt="burnt">
              <mc-item class="item" bind:item="apple"></mc-item>
              <span t="ixchel_sample.effects.card"></span>
            </div>
            <button class="toggle burn-toggle" on:click="burnt = !burnt" t="ixchel_sample.effects.burn"></button>
          </div>
          <div class="row">
            <div class="card scrub" bind:style:--Burn-progress="progress">
              <mc-item class="item" bind:item="apple"></mc-item>
              <span t="ixchel_sample.effects.card"></span>
            </div>
            <button class="toggle step" on:click="progress = (progress + 0.25) % 1.25" t="ixchel_sample.effects.step"></button>
            <span class="caption progress" bind:text="progress"></span>
          </div>
        </div>
      </div>

      <div class="page" bind:class:shown="tab == 'shapes'">
        <span class="section" t="ixchel_sample.effects.corner_shapes"></span>
        <div class="ground shapes">
          <span class="caption" t="ixchel_sample.effects.shape_auto"></span>
          <div class="shape-row smooth">
            <div class="shape round"></div>
            <div class="shape bevel"></div>
            <div class="shape notch"></div>
            <div class="shape scoop"></div>
            <div class="shape square-corner"></div>
            <div class="shape shadowed"></div>
          </div>
          <span class="caption" t="ixchel_sample.effects.shape_crisp"></span>
          <div class="shape-row crisp">
            <div class="shape round"></div>
            <div class="shape bevel"></div>
            <div class="shape notch"></div>
            <div class="shape scoop"></div>
            <div class="shape square-corner"></div>
            <div class="shape shadowed"></div>
          </div>
        </div>
        <span class="section" t="ixchel_sample.effects.fonts"></span>
        <div class="fonts">
          <span class="font plain" t="ixchel_sample.effects.font_sample"></span>
          <span class="font uniform" t="ixchel_sample.effects.font_sample"></span>
          <span class="font alt" t="ixchel_sample.effects.font_sample"></span>
          <span class="font upper" t="ixchel_sample.effects.font_sample"></span>
          <span class="font codes">§c§l</span>
        </div>
      </div>
    </div>
  </div>
</page>
