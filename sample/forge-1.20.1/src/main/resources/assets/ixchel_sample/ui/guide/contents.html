<link rel="stylesheet" href="@ixchel/dark.css"/>
<link rel="component" href="book.html"/>
<link rel="component" href="page.html"/>
<guide-book bind:spread="spread" bind:spreads="spreads" bind:history="history"
            on:prev="prev" on:next="next" on:back="back" on:contents="contents"
            on:keydown.left="prev" on:keydown.right="next" on:keydown.backspace="back">
  <guide-page heading="Ixchel Guide">
    <div class="text">
      <mc-item class="icon" bind:item="icons.book"></mc-item> A sample guidebook. Every entry is a
      template under <span class="i">ui/guide/entries</span>, so editing one in a development run
      reloads it in place.
    </div>
    <div class="text">
      Click a <a on:click="open('circuits')">link</a> to follow it; <span class="b">Back</span> or
      <span class="key">Backspace</span> returns. Turn pages with the arrows or
      <span class="key">←</span> <span class="key">→</span>.
    </div>
  </guide-page>
  <guide-page heading="Contents">
    <for each="entries" as="e" key="e.id"><div class="text toc">
      <a on:click="open(e.id)" bind:text="e.title"></a>
    </div></for>
  </guide-page>
</guide-book>
