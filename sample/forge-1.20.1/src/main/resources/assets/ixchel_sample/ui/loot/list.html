<link href="list.css"/>
<page>
  <div class="screen">
    <div class="ix-panel">
      <div class="header">
        <span class="ix-title" t="ixchel_sample.loot.title"></span>
        <span class="count" t="ixchel_sample.loot.count"><span bind:text="rows.size"></span><span bind:text="drops.size"></span></span>
      </div>
      <div class="filters">
        <for each="filters" as="f" key="f.level"><div class="filter" bind:class:ix-selected="f.level == minRarity" on:click="minRarity = f.level">
          <span bind:text="f.label"></span>
        </div></for>
      </div>
      <div class="list">
        <for each="rows" as="r" key="r.id" index="i"><div class="row" bind:class:odd="i % 2 == 1">
          <div class="arrow" bind:style:transform="'rotate(' + (r.heading - 45) + 'deg)'"></div>
          <mc-item class="icon" bind:item="r.icon"></mc-item>
          <span class="name" bind:style:color="r.color" bind:text="r.name"></span>
          <span class="amount" bind:text="r.count"></span>
          <span class="distance" bind:text="r.distance"></span>
          <div class="pick" bind:disabled="!r.inRange" t:title="ixchel_sample.loot.pick_range" on:click="pickUp(r)"><span t="ixchel_sample.loot.pick"></span></div>
        </div></for><empty><span class="empty" t="ixchel_sample.loot.empty"></span></empty>
      </div>
    </div>
  </div>
</page>
