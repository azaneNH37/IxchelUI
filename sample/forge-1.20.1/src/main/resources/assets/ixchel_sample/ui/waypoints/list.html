<link href="list.css"/>
<page>
  <div class="screen" on:keydown.up="selectPrevious" on:keydown.down="selectNext" on:keydown.delete="remove">
    <div class="ix-panel">
      <div class="header">
        <span class="ix-title" t="ixchel_sample.waypoints.title"></span>
        <if test="rows.size == 1"><span class="count" t="ixchel_sample.waypoints.count.one"></span></if>
        <if test="rows.size != 1"><span class="count" t="ixchel_sample.waypoints.count"><span bind:text="rows.size"></span></span></if>
      </div>
      <span class="hint" t="ixchel_sample.waypoints.hint"></span>
      <div class="list">
        <if test="rows.size == 0"><span class="empty" t="ixchel_sample.waypoints.empty"></span></if>
        <for each="rows" as="r" key="r.id"><div class="row" tabindex="0" on:click="select(r)" bind:class:ix-selected="r.id == selectedId">
          <span class="name" bind:text="r.name"></span>
          <span class="coords" bind:text="r.x + ', ' + r.y + ', ' + r.z"></span>
          <span class="distance" bind:text="r.distance + ' m'"></span>
        </div></for>
      </div>
      <div class="buttons">
        <button t:title="ixchel_sample.waypoints.add_title" on:click="add" t="ixchel_sample.waypoints.add"></button>
        <if test="selectedId >= 0"><button on:click="remove" t="ixchel_sample.waypoints.remove"></button></if>
      </div>
    </div>
  </div>
</page>
