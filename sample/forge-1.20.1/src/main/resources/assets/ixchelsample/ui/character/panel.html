<link rel="stylesheet" href="../common/slot.css"/>
<link rel="stylesheet" href="@ixchel/vanilla.css"/>
<link rel="stylesheet" href="panel.css"/>
<link rel="component" href="../common/player-inventory.html"/>
<div class="panel">
  <div class="tabs">
    <for each="tabs" as="t" key="t.id"><div class="tab" bind:class:selected="t.id == tab" on:click="select(t)">
      <span bind:text="t.label"></span>
    </div></for>
  </div>
  <div class="page equipment" bind:class:shown="tab == 'equipment'">
    <div class="column">
      <mc-slot class="slot" index="5"></mc-slot>
      <mc-slot class="slot" index="6"></mc-slot>
      <mc-slot class="slot" index="7"></mc-slot>
      <mc-slot class="slot" index="8"></mc-slot>
    </div>
    <mc-entity class="doll" bind:entity="doll" title="You. The doll looks at the pointer."></mc-entity>
    <div class="column offhand">
      <mc-slot class="slot" index="45"></mc-slot>
    </div>
    <div class="crafting">
      <div class="craft-grid">
        <mc-slot class="slot" index="1"></mc-slot>
        <mc-slot class="slot" index="2"></mc-slot>
        <mc-slot class="slot" index="3"></mc-slot>
        <mc-slot class="slot" index="4"></mc-slot>
      </div>
      <span class="arrow">↓</span>
      <mc-slot class="slot result" index="0"></mc-slot>
    </div>
  </div>
  <div class="page list" bind:class:shown="tab == 'attributes'">
    <for each="attributes" as="a" key="a.name"><div class="row attribute" bind:title="a.description">
      <span class="name" bind:text="a.name"></span>
      <span class="value" bind:text="a.value"></span>
    </div></for>
  </div>
  <div class="page list" bind:class:shown="tab == 'effects'">
    <if test="effects.size == 0"><span class="empty">No active effects.</span></if>
    <for each="effects" as="e" key="e.id"><div class="row effect" bind:class:ending="e.ending" bind:class:dim="e.dim">
      <img class="effect-icon" bind:src="e.icon"/>
      <span class="name" bind:text="e.name"></span>
      <span class="value" bind:text="e.time"></span>
    </div></for>
  </div>
  <div class="page list" bind:class:shown="tab == 'stats'">
    <for each="stats" as="s" key="s.name"><div class="row stat">
      <span class="name" bind:text="s.name"></span>
      <span class="value" bind:text="s.value"></span>
    </div></for>
  </div>
  <player-inventory bind:inventory="inventory" bind:hotbar="hotbar"></player-inventory>
</div>
