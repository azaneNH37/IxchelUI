<link rel="stylesheet" href="hud.css"/>
<div class="env">
  <div class="vitals">
    <div class="line">
      <div class="icons">
        <div class="icon heart" each="hearts" as="h" key="h.index">
          <div class="fill" bind:class:full="h.full" bind:class:half="h.half"></div>
        </div>
      </div>
    </div>
    <div class="line" if="hasArmor">
      <div class="icons">
        <div class="icon armor" each="armorIcons" as="a" key="a.index" bind:class:full="a.full" bind:class:half="a.half"></div>
      </div>
    </div>
    <div class="line">
      <div class="icons">
        <div class="icon food" each="foodIcons" as="f" key="f.index">
          <div class="fill" bind:class:full="f.full" bind:class:half="f.half"></div>
        </div>
      </div>
    </div>
    <div class="xp">
      <div class="xp-fill" bind:style:width="progressWidth"></div>
    </div>
    <span class="level" bind:text="level"></span>
  </div>
  <div class="top">
    <div class="compass">
      <div class="bar">
        <div class="strip" bind:style:left="stripLeft">
          <div class="mark" each="marks" as="m" key="m.id" bind:style:left="m.left" bind:class:major="m.major">
            <div class="tick"></div>
            <span class="mark-label" bind:text="m.label"></span>
          </div>
        </div>
        <div class="needle"></div>
      </div>
      <div class="waypoint" each="markers" as="w" key="w.id" bind:style:left="w.left" bind:class:near="w.near" bind:class:edge="w.edge">
        <div class="pip"></div>
        <span class="waypoint-label" bind:text="w.label"></span>
      </div>
    </div>
    <div class="target" if="hasTarget">
      <div class="block" if="hasBlock">
        <mc-item class="block-icon" bind:item="blockIcon"></mc-item>
        <div class="lines">
          <span class="name" bind:text="block.name"></span>
          <span class="tool" bind:class:bad="!block.harvestable" bind:text="block.tool"></span>
          <div class="property" each="block.properties" as="p" key="p.name">
            <span class="key" bind:text="p.name"></span>
            <span class="value" bind:text="p.value"></span>
          </div>
          <span class="mod" bind:text="block.mod"></span>
        </div>
      </div>
      <div class="entity" if="hasEntity">
        <span class="name" bind:text="entity.name"></span>
        <div class="health" if="entity.living">
          <div class="health-bar">
            <div class="health-fill" bind:style:width="entityHealthWidth"></div>
          </div>
          <span class="health-text" bind:text="entityHealth"></span>
        </div>
        <span class="armor-text" if="entityHasArmor" bind:text="entityArmor"></span>
        <span class="mod" bind:text="entity.mod"></span>
      </div>
    </div>
  </div>
  <div class="world">
    <span class="biome" bind:text="world.biome"></span>
    <span class="time" bind:text="world.time"></span>
    <span class="weather" bind:text="world.weather"></span>
    <span class="light" bind:text="world.light"></span>
    <span class="coords" bind:text="world.coords"></span>
    <span class="facing" bind:text="world.facing"></span>
  </div>
</div>
