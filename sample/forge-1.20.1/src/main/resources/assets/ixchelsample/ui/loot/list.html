<link rel="stylesheet" href="list.css"/>
<div class="screen">
  <div class="panel">
    <div class="header">
      <span class="title">Nearby drops</span>
      <span class="count" bind:text="rows.size + ' of ' + drops.size + ' drops'"></span>
    </div>
    <div class="filters">
      <div class="filter" each="filters" as="f" key="f.level" bind:class:selected="f.level == minRarity" on:click="minRarity = f.level">
        <span bind:text="f.label"></span>
      </div>
    </div>
    <div class="list">
      <span class="empty" if="rows.size == 0">Nothing dropped nearby.</span>
      <div class="row" each="rows" as="r" key="r.id">
        <span class="arrow" bind:text="r.arrow"></span>
        <mc-item class="icon" bind:item="r.icon"></mc-item>
        <span class="name" bind:style:color="r.color" bind:text="r.name"></span>
        <span class="amount" bind:text="r.count"></span>
        <span class="distance" bind:text="r.distance"></span>
        <div class="pick" bind:disabled="!r.inRange" title="Within 8 blocks" on:click="pickUp(r)"><span>Pick up</span></div>
      </div>
    </div>
  </div>
</div>
