<link rel="stylesheet" href="panel.css"/>
<div class="panel">
  <div class="header">
    <span class="title">Powered Stonecutter</span>
    <span class="status" bind:class:bad="statusBad" bind:text="statusText"></span>
  </div>
  <div class="body">
    <div class="bar energy" bind:title="energyText">
      <div class="energy-fill" bind:style:height="energyHeight"></div>
    </div>
    <div class="bar tank" bind:title="waterText">
      <div class="water-fill" bind:style:height="waterHeight" bind:style:background-color="waterColor"></div>
    </div>
    <div class="feed">
      <item-slot class="slot" slot="1" title="Water bucket: 1000 mB"></item-slot>
      <div class="flame">
        <div class="flame-fill" bind:style:height="flameHeight" bind:style:background-position-y="flameY"></div>
      </div>
      <item-slot class="slot" slot="0" title="Fuel"></item-slot>
    </div>
    <div class="work">
      <div class="io">
        <item-slot class="slot" slot="2"></item-slot>
        <div class="arrow">
          <div class="arrow-fill" bind:style:width="arrowWidth"></div>
        </div>
        <item-slot class="slot output" slot="3"></item-slot>
      </div>
      <div class="recipes">
        <span class="hint" if="noRecipes">Put a block to cut in the left slot.</span>
        <div class="recipe" each="recipes" as="r" key="r.index" bind:class:selected="r.selected" bind:title="r.name"
             on:click="pick(r)">
          <item class="icon" bind:item="r.icon"></item>
        </div>
      </div>
    </div>
  </div>
  <div class="buttons">
    <div class="button redstone" on:click="cycleRedstone"><span bind:text="redstoneLabel"></span></div>
    <div class="button sides-toggle" bind:class:selected="sidesOpen" on:click="toggleSides"><span>Sides</span></div>
  </div>
  <div class="grid">
    <item-slot class="slot" each="inventory" as="i" key="i" bind:slot="i"></item-slot>
  </div>
  <div class="grid hotbar">
    <item-slot class="slot" each="hotbar" as="i" key="i" bind:slot="i"></item-slot>
  </div>
  <div class="sides" bind:class:open="sidesOpen">
    <div class="side" each="sideRows" as="s" key="s.side" on:click="cycleSide(s)">
      <span class="face" bind:text="s.face"></span>
      <span class="mode" bind:class:input="s.input" bind:class:output="s.output" bind:text="s.mode"></span>
    </div>
  </div>
</div>
