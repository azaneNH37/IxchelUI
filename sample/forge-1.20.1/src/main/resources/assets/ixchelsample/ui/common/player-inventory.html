<link rel="stylesheet" href="slot.css"/>
<link rel="stylesheet" href="player-inventory.css"/>
<!-- The player's main inventory above the hotbar, vanilla's layout; both lists are menu slot indices. -->
<template name="player-inventory" params="inventory hotbar">
  <div class="grid">
    <for each="inventory" as="i" key="i"><mc-slot class="slot" bind:index="i"></mc-slot></for>
  </div>
  <div class="grid hotbar">
    <for each="hotbar" as="i" key="i"><mc-slot class="slot" bind:index="i"></mc-slot></for>
  </div>
</template>
