<link rel="stylesheet" href="panel.css"/>
<div class="screen" on:keydown.escape="cancel">
  <div class="panel">
    <div class="header">
      <span class="title">Ixchel sample settings</span>
      <input class="search" placeholder="Search all settings" bind:value="query"/>
    </div>
    <div class="body">
      <div class="categories">
        <for each="categories" as="c" key="c.id"><div class="category" tabindex="0"
             bind:class:active="c.active" on:click="select(c)" on:keydown.enter="select(c)">
          <span bind:text="c.label"></span>
        </div></for>
      </div>
      <div class="entries">
        <if test="rows.size == 0"><span class="none">No setting matches the search</span></if>
        <for each="rows" as="r" key="r.id"><div class="entry" bind:title="r.comment"
             bind:class:modified="r.modified" bind:class:invalid="r.invalid">
          <div class="line">
            <div class="marker"></div>
            <span class="name" bind:text="r.label"></span>
            <if test="r.restart"><span class="restart">restart</span></if>
            <div class="control">
              <if test="r.bool"><input type="checkbox" class="check" bind:checked="r.on"/></if>
              <if test="r.number"><div class="number">
                <input type="range" class="slider" bind:min="r.min" bind:max="r.max" bind:step="r.step" bind:value="r.value"/>
                <input type="number" class="num" bind:min="r.min" bind:max="r.max" bind:step="r.step" bind:value="r.value"/>
              </div></if>
              <if test="r.choice"><select class="choice" bind:value="r.value">
                <for each="r.choices" as="o" key="o"><option bind:value="o" bind:text="o"></option></for>
              </select></if>
              <if test="r.text"><input class="text" bind:value="r.value"/></if>
              <if test="r.color"><div class="color">
                <div class="swatch" bind:style:background-color="r.swatch"></div>
                <input class="hex" maxlength="7" bind:value="r.value"/>
              </div></if>
              <if test="r.list"><div class="list">
                <span class="summary" bind:text="r.value"></span>
                <button class="edit" on:click="editList(r)">Edit</button>
              </div></if>
              <button class="reset" bind:disabled="r.atDefault" on:click="reset(r)">Reset</button>
            </div>
          </div>
          <if test="r.invalid"><span class="error" bind:text="r.error"></span></if>
        </div></for>
      </div>
    </div>
    <div class="footer">
      <span class="status" bind:text="status"></span>
      <if test="restartPending"><span class="note">Some changes apply after rejoining a world</span></if>
      <button class="undo" bind:disabled="!canUndo" on:click="undo">Undo</button>
      <button class="cancel" on:click="cancel">Cancel</button>
      <button class="save" bind:disabled="!canSave" on:click="save">Save</button>
    </div>
  </div>
  <dialog class="list-dialog" bind:open="listOpen">
    <span class="dialog-title" bind:text="listTitle"></span>
    <div class="items">
      <for each="items" as="i" key="i.id"><div class="item">
        <input class="item-text" bind:value="i.text"/>
        <button class="remove" on:click="removeItem(i)">Remove</button>
      </div></for>
    </div>
    <div class="dialog-row">
      <button class="add" on:click="addItem">Add</button>
      <select class="preset" bind:value="preset" on:change="addPreset">
        <option value="">Add a preset...</option>
        <option value="minecraft:rotten_flesh">Rotten flesh</option>
        <option value="minecraft:poisonous_potato">Poisonous potato</option>
        <option value="minecraft:spider_eye">Spider eye</option>
        <option value="minecraft:dead_bush">Dead bush</option>
      </select>
    </div>
    <div class="dialog-row">
      <button class="list-cancel" on:click="listOpen = false">Cancel</button>
      <button class="list-done" on:click="applyList">Done</button>
    </div>
  </dialog>
  <dialog class="confirm" bind:open="confirming">
    <span>Discard the unsaved changes?</span>
    <div class="dialog-row">
      <button class="keep" on:click="confirming = false">Keep editing</button>
      <button class="discard" on:click="discard">Discard</button>
    </div>
  </dialog>
</div>
