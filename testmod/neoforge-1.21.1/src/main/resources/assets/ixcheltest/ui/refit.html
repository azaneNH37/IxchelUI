<link rel="stylesheet" href="refit.css"/>
<div class="screen">
  <div class="panel">
    <span class="title" bind:text="gunName"></span>
    <div class="gone" if="!valid">
      <span>The crossbow left the slot this screen was opened on. Put it back, or press Esc.</span>
    </div>
    <div class="body" if="valid">
      <div class="column">
        <span class="label">Attachments</span>
        <div class="row slot" each="slots" as="s" key="s.type" tabindex="0"
             on:click="select(s)" bind:class:selected="s.selected">
          <item class="icon" bind:item="s.icon"></item>
          <span bind:text="s.name"></span>
        </div>
      </div>
      <div class="column" if="hasSelection">
        <span class="label" bind:text="selectedName"></span>
        <div class="options" bind:class:busy="install.pending">
          <div class="row option" each="options" as="o" key="o.id" on:click="install(o)"
               bind:class:installed="o.installed" bind:class:missing="o.missing">
            <item class="icon" bind:item="o.icon"></item>
            <span bind:text="o.label"></span>
          </div>
        </div>
        <div class="button" if="hasInstalled" on:click="remove" bind:class:busy="remove.pending">
          <span>Remove</span>
        </div>
      </div>
      <div class="column">
        <span class="label">Laser</span>
        <div class="row swatch" each="swatches" as="w" key="w.id" on:click="pickLaser(w)"
             bind:class:selected="w.draft" bind:class:installed="w.current">
          <item class="icon" bind:item="w.icon"></item>
          <span bind:text="w.name"></span>
        </div>
        <div class="button" if="hasDraft" on:click="applyLaser" bind:class:busy="applyLaser.pending">
          <span>Apply</span>
        </div>
      </div>
    </div>
    <div class="error" if="hasError">
      <span bind:text="errorText"></span>
    </div>
  </div>
</div>
