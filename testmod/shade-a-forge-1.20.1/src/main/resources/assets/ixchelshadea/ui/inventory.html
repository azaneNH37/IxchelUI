<link rel="stylesheet" href="inventory.css"/>
<div class="panel">
  <span class="title">Shade A inventory</span>
  <div class="row">
    <div class="column">
      <for each="armor" as="s" key="s"><mc-slot class="slot" bind:index="s"></mc-slot></for>
      <mc-slot class="slot" index="45"></mc-slot>
    </div>
    <div class="grid crafting">
      <for each="crafting" as="s" key="s"><mc-slot class="slot" bind:index="s"></mc-slot></for>
    </div>
    <mc-slot class="slot result" index="0"></mc-slot>
  </div>
  <div class="grid">
    <for each="main" as="s" key="s"><mc-slot class="slot" bind:index="s"></mc-slot></for>
  </div>
  <div class="grid hotbar">
    <for each="hotbar" as="s" key="s"><mc-slot class="slot" bind:index="s"></mc-slot></for>
  </div>
</div>
