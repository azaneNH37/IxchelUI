name: check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# PRs: a new push makes the old run meaningless. master: queue instead, so every
# merged commit is fully checked and gets to write the Gradle cache.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      # v5, not v6: v6 moves caching into a proprietary component under Gradle's Terms of Use.
      # Caches Gradle User Home (deps, NFRT Minecraft artifacts, build cache);
      # only the default branch writes, PRs read master's entry.
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # docs:build first runs `gradlew docs`: the reference pages and Javadoc, failing on stale names in docs/.
      - run: pnpm install --frozen-lockfile && pnpm docs:build
        working-directory: docs

      # Internal links only; the site is not deployed from here.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/docs/.vuepress/dist 'docs/.vuepress/dist/**/*.html'
          fail: true

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
